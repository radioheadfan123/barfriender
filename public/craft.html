<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craft · pourpair</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header><h1><a href="/">pourpair</a></h1><div id="account"></div></header>
  <p class="sub">Build a drink one ingredient at a time. Add anything; we suggest what goes with what is already in the glass.</p>
  <input id="search" list="names" placeholder="Add anything to the glass, e.g. rum" autocomplete="off" aria-label="Add to the glass">

  <h2 id="glassTitle">In the glass</h2>
  <div id="glass"></div>
  <div id="pairsNow" aria-live="polite"></div>
  <textarea id="notes" rows="3" placeholder="Notes: method, glass, garnish" aria-label="Drink notes"></textarea>
  <p class="row">
    <button class="primary" id="saveBtn">Save drink</button>
    <button class="link" id="resetBtn">Start over</button>
  </p>

  <h2>Add next</h2>
  <div class="status" id="status" aria-live="polite">Loading ingredients…</div>
  <div id="results"></div>

  <section id="mine" hidden>
    <h2>My combos</h2>
    <div id="comboList"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/common.js"></script>
<script>
let glass = [];        // [{ id, name, amount }]
let drink = null;      // { id, name } once saved or opened from My combos

function renderGlass() {
  $("glassTitle").textContent = drink ? drink.name : "In the glass";
  if (!glass.length) { $("glass").replaceChildren(el("p", { className: "legend", textContent: "Empty. Start with a spirit." })); }
  else $("glass").replaceChildren(...glass.map((it) => {
    const amt = el("input", { value: it.amount, placeholder: "amount", maxLength: 40, oninput: (e) => { it.amount = e.target.value; } });
    amt.setAttribute("aria-label", "Amount of " + it.name);
    const rm = el("button", { type: "button", className: "link", textContent: "×",
      onclick: () => { glass = glass.filter((x) => x !== it); update(); } });
    rm.setAttribute("aria-label", "Remove " + it.name);
    return el("div", { className: "item" }, el("span", { textContent: it.name }), amt, rm);
  }));
  $("saveBtn").textContent = user ? "Save drink" : "Sign in to save";
  $("saveBtn").disabled = user && !glass.length;
}

// Each glass ingredient's pairings, fetched once: id -> Map(partner id -> strength).
const partners = new Map();
async function pairsOf(id) {
  if (!partners.has(id)) {
    const { data } = await sb.rpc("ingredient_pairings", { ing: id });
    partners.set(id, new Map((data || []).map((r) => [r.id, r.strength])));
  }
  return partners.get(id);
}

// Largest groups in the glass where every member pairs with every other (glass is small, so brute force).
// ponytail: 2^n subsets, fine to ~15 ingredients; Bron-Kerbosch if drinks ever get bigger.
function groups(ids, pm) {
  const ok = (a, b) => pm.get(a).has(b) || pm.get(b).has(a);
  const cliques = [];
  for (let mask = (1 << ids.length) - 1; mask > 0; mask--) {
    const set = ids.filter((_, i) => mask & (1 << i));
    if (set.length < 2 || !set.every((a, i) => set.slice(i + 1).every((b) => ok(a, b)))) continue;
    if (!cliques.some((c) => set.every((x) => c.includes(x)))) cliques.push(set);
  }
  return cliques.sort((a, b) => b.length - a.length);
}

async function suggest() {
  if (!glass.length) {
    const bar = [...byId.values()].filter((r) => r.is_bar);
    $("pairsNow").replaceChildren();
    $("status").textContent = "Pick a base. Every bar ingredient we know:";
    $("results").replaceChildren(...bar.map((r) => chip(r, "", () => add(r.name))));
    return;
  }
  $("status").textContent = "Looking…";
  const ids = glass.map((g) => g.id);
  const pm = new Map(await Promise.all(ids.map(async (id) => [id, await pairsOf(id)])));
  if (ids.join() !== glass.map((g) => g.id).join()) return;   // glass changed while loading

  // what in the glass already pairs together
  const name = (id) => byId.get(id).name;
  const gs = ids.length > 1 ? groups(ids, pm) : [];
  const alone = ids.filter((id) => ids.length > 1 && !gs.some((g) => g.includes(id)));
  $("pairsNow").replaceChildren(
    ...(gs.length ? [el("p", { textContent: "These pair well together: " + gs.map((g) => g.map(name).join(" + ")).join(" · ") })] : []),
    ...(alone.length ? [el("p", { className: "legend", textContent: "No known pairing yet: " + alone.map(name).join(", ") })] : []));

  // suggestions: bar ingredients ranked by how many glass ingredients they go with, then strength
  const score = new Map();
  for (const [, m] of pm) for (const [id, s] of m) {
    if (ids.includes(id) || !byId.get(id)?.is_bar) continue;
    const cur = score.get(id) || { n: 0, sum: 0, min: 4 };
    score.set(id, { n: cur.n + 1, sum: cur.sum + s, min: Math.min(cur.min, s) });
  }
  const ranked = [...score].sort(([, a], [, b]) => b.n - a.n || b.sum - a.sum);
  const sections = [];
  for (let n = ids.length; n >= 1 && sections.length < 3; n--) {
    const list = ranked.filter(([, v]) => v.n === n);
    if (!list.length) continue;
    sections.push(el("section", {}, el("h3", { textContent: n === ids.length ? `Goes with everything (${list.length})` : `Goes with ${n} of ${ids.length} (${list.length})` }),
      el("div", { className: "chips" }, ...list.map(([id, v]) => chip({ name: name(id), strength: v.min }, "", () => add(name(id)))))));
  }
  $("status").textContent = sections.length ? "Strongest first. Or type anything in the box above." : "No suggestions. Type anything in the box above.";
  $("results").replaceChildren(...sections);
}

const save = () => keep.set("glass", { glass, drink, notes: $("notes").value });
function update() { save(); renderGlass(); suggest(); }
$("notes").addEventListener("input", save);
$("glass").addEventListener("input", save);   // amounts

function add(typed) {
  const name = find(typed), id = byName.get(name);
  if (!id) { if (typed) $("status").textContent = `No ingredient called "${typed}". Try the dropdown.`; return; }
  if (!glass.some((g) => g.id === id)) { glass.push({ id, name, amount: "" }); update(); }
  $("search").value = "";
}
$("search").addEventListener("change", (e) => add(e.target.value.trim()));

$("saveBtn").onclick = () => {
  if (!user) return $("authDlg").showModal();
  openCombo({ id: drink?.id ?? null, name: drink?.name || "", notes: $("notes").value, is_drink: true,
              items: glass.map((g) => ({ ...g })) });
};
// The dialog can rename, re-amount or remove; mirror what was saved back into the glass.
window.onComboSaved = (id) => {
  if (id === null) { drink = null; return renderGlass(); }
  drink = { id, name: $("cName").value.trim() };
  glass = editing.items.map((i) => ({ ...i }));
  $("notes").value = $("cNotes").value;
  update();
};
$("resetBtn").onclick = () => { glass = []; drink = null; $("notes").value = ""; update(); };
window.onUser = renderGlass;

// '#combo=12' opens a saved drink from My combos.
async function fromHash() {
  const m = location.hash.match(/^#combo=(\d+)$/);
  if (m) {
    const { data } = await sb.from("combos")
      .select("id, name, notes, combo_items(ingredient_id, amount, position)").eq("id", m[1]).maybeSingle();
    if (data) {
      drink = { id: data.id, name: data.name };
      $("notes").value = data.notes || "";
      glass = data.combo_items.sort((a, b) => a.position - b.position).filter((i) => byId.has(i.ingredient_id))
        .map((i) => ({ id: i.ingredient_id, name: byId.get(i.ingredient_id).name, amount: i.amount || "" }));
    }
    history.replaceState(null, "", "/craft.html");
  } else {
    const k = keep.get("glass");
    if (k) {
      glass = (k.glass || []).filter((g) => byId.has(g.id));
      drink = k.drink || null;
      $("notes").value = k.notes || "";
    }
  }
  update();
}
window.addEventListener("hashchange", fromHash);
ready.then(fromHash);
</script>
</body>
</html>
