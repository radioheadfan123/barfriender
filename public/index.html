<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>barfriender</title>
<meta name="description" content="Pick bar ingredients and see what pairs well with all of them. Save drinks and build menus with friends.">
<meta property="og:title" content="barfriender">
<meta property="og:description" content="Pick bar ingredients and see what pairs well with all of them. Save drinks and build menus with friends.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://barfriender.app/">
<meta property="og:image" content="https://barfriender.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="barfriender: pick your ingredients, see what pairs well with all of them">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#15110d">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top"></header>
<div class="layout" id="layout">
  <main>
    <div class="combo">
      <input id="search" role="combobox" aria-expanded="false" aria-controls="matches" aria-autocomplete="list"
             placeholder="Add an ingredient, like lime or mint" autocomplete="off" autocapitalize="none" enterkeyhint="done" aria-label="Add an ingredient">
      <ul id="matches" role="listbox" aria-label="Matching ingredients" hidden></ul>
    </div>

    <section class="card" aria-label="Your mix">
      <div class="mixrow">
        <div class="chips" id="pills" aria-label="Your mix"></div>
        <div class="actions sticky" id="actions" hidden>
          <button class="btn primary" id="saveBtn">Save</button>
        </div>
      </div>
      <div class="mixrow">
        <div id="together" aria-live="polite" class="faint">Add an ingredient to start. Tap anything in your mix to explore it.</div>
        <span class="row" id="mixLinks" hidden>
          <button class="link" id="amountsBtn">+ Add amounts and notes</button>
          <button class="link" id="clearBtn">Clear</button>
        </span>
      </div>
      <div class="amounts stack" id="amounts" hidden>
        <input id="mixName" placeholder="Name (optional, we'll name it for you)" maxlength="80" aria-label="Name">
        <div id="amountRows"></div>
        <textarea id="notes" rows="3" maxlength="2000" placeholder="Notes: method, glass, garnish, ideas" aria-label="Notes"></textarea>
      </div>
    </section>

    <section id="suggest" hidden>
      <div class="toolbar">
        <h2>What to add next</h2>
        <label class="switch" title="Hide cooking ingredients like pasta or quail"><input type="checkbox" id="barOnly"> Drink ingredients only</label>
      </div>
      <div class="filter" id="filter" hidden></div>
      <div id="status" class="faint" aria-live="polite"></div>
      <div id="groups"></div>
    </section>
  </main>
  <aside id="panel" aria-label="Explore" hidden></aside>
</div>

<dialog id="renameDlg">
  <form id="renameForm" class="stack">
    <h2>Rename</h2>
    <input id="renameInput" maxlength="80" required aria-label="Name">
    <div class="row"><button class="btn primary">Save name</button><button class="link" value="close" formnovalidate>Cancel</button></div>
  </form>
</dialog>

<script src="/vendor/supabase-2.117.2.js"></script>
<script src="/common.js"></script>
<script src="/pairing.js"></script>
<script src="/mix.js"></script>
</body>
</html>
